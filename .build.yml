image: debian/stable
packages:
  - sbcl
  - curl
  - git
tasks:
  - clone: |
      cd ~
      git clone https://git.sr.ht/~hajovonta/ariadne || git clone git@git.sr.ht:~hajovonta/ariadne
  - setup-quicklisp: |
      curl -sL https://beta.quicklisp.org/quicklisp.lisp -o /tmp/quicklisp.lisp
      sbcl --noinform --non-interactive \
        --load /tmp/quicklisp.lisp \
        --eval '(quicklisp-quickstart:install)'
  - test: |
      ln -s ~/ariadne ~/quicklisp/local-projects/ariadne
      sbcl --noinform --non-interactive \
        --load ~/quicklisp/setup.lisp \
        --eval '(ql:quickload :ariadne-tests)' \
        --eval '(let ((results (5am:run :ariadne))) (format t "~%~A~%" (if (5am:results-status results) "ALL TESTS PASSED" "TESTS FAILED")) (unless (5am:results-status results) (uiop:quit 1)))'
