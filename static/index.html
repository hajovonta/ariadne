<!DOCTYPE html>
<html><head>
<title>Ariadne Graph Explorer</title>
<script src='https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js'></script>
<script src='https://unpkg.com/layout-base@2.0.1/layout-base.js'></script>
<script src='https://unpkg.com/cose-base@2.2.0/cose-base.js'></script>
<script src='https://unpkg.com/cytoscape-cose-bilkent@4.1.0/cytoscape-cose-bilkent.js'></script>
<script src='https://unpkg.com/dagre@0.8.5/dist/dagre.min.js'></script>
<script src='https://unpkg.com/cytoscape-dagre@2.5.0/cytoscape-dagre.js'></script>
<script src='https://unpkg.com/cytoscape-svg@0.4.0/cytoscape-svg.js'></script>
<style>
  :root {
    --bg: #1a1a2e; --panel: #16213e; --input: #0f3460; --text: #eee;
    --border: #444; --accent: #e94560; --node: #e94560; --edge: #0f3460;
    --dim: #333; --highlight: #ffd700;
  }
  .light {
    --bg: #f5f5f5; --panel: #ffffff; --input: #e8e8e8; --text: #222;
    --border: #ccc; --accent: #d63031; --node: #d63031; --edge: #b2bec3;
    --dim: #ddd; --highlight: #f39c12;
  }
  body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
  #cy { width: 100%; height: calc(100vh - 50px - 36px); background: var(--bg); }
  #toolbar { height: auto; min-height: 40px; display: flex; align-items: center; padding: 6px 16px; gap: 8px; background: var(--panel); flex-wrap: wrap; }
  #toolbar input, #toolbar select, #toolbar button {
    padding: 6px 10px; border-radius: 4px; border: 1px solid var(--border); background: var(--input); color: var(--text); }
  #toolbar button { cursor: pointer; }
  #toolbar button:hover { background: var(--accent); }
  #info { position: fixed; bottom: 16px; right: 16px; background: var(--panel); padding: 12px;
    border-radius: 8px; max-width: 350px; max-height: 30vh; overflow-y: auto;
    font-size: 13px; display: none; border: 1px solid var(--border); z-index: 60; }
  #predicates { max-width: 300px; }
  #pred-panel { position: fixed; top: 50px; left: 0; background: var(--panel); padding: 12px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0 0 8px 0;
    max-height: 80vh; overflow-y: auto; display: none; min-width: 200px; z-index: 10; }
  #pred-panel label { display: block; padding: 3px 0; cursor: pointer; font-size: 13px; }
  #pred-panel label:hover { color: var(--accent); }
  #pred-panel input { margin-right: 6px; }
  .panel-btns { margin-bottom: 6px; display: flex; gap: 4px; }
  .panel-btns button { padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border);
    background: var(--input); color: var(--text); cursor: pointer; font-size: 11px; }
  .panel-btns button:hover { background: var(--accent); }
  #type-panel { position: fixed; top: 50px; left: 220px; background: var(--panel); padding: 12px;
    border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0 0 8px 0;
    max-height: 80vh; overflow-y: auto; display: none; min-width: 180px; z-index: 10; }
  #type-panel label { display: block; padding: 3px 0; cursor: pointer; font-size: 13px; }
  #type-panel label:hover { color: var(--accent); }
  #type-panel input { margin-right: 6px; }
  #legend { position: fixed; top: 50px; right: 0; background: var(--panel); padding: 12px;
    border-left: 1px solid var(--border); border-bottom: 1px solid var(--border); border-radius: 0 0 0 8px;
    font-size: 12px; display: none; z-index: 10; }
  .legend-item { padding: 2px 0; display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 50%%; display: inline-block; }
  #ctx-menu { position: fixed; background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 0; display: none; z-index: 100; min-width: 140px; }
  #ctx-menu div { padding: 6px 14px; cursor: pointer; font-size: 13px; }
  #ctx-menu div:hover { background: var(--accent); }
  #query-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel);
    border-top: 1px solid var(--border); z-index: 50; max-height: 40vh; overflow: hidden;
    display: none; flex-direction: column; }
  #query-panel.open { display: flex; }
  #query-input { width: 100%; height: 60px; background: var(--input); color: var(--text); border: none;
    padding: 8px; font-family: monospace; font-size: 13px; resize: none; }
  #query-bar { display: flex; gap: 8px; padding: 6px 8px; align-items: center; }
  #query-bar button { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--input); color: var(--text); cursor: pointer; }
  #query-bar button:hover { background: var(--accent); }
  #query-results { overflow: auto; flex: 1; padding: 0 8px 8px; }
  #query-results table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #query-results th { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); color: var(--text); opacity: 0.7; }
  #query-results td { padding: 4px 8px; border-bottom: 1px solid var(--dim); cursor: pointer; }
  #query-results td:hover { color: var(--highlight); }
  #construct-panel { position: fixed; bottom: 0; left: 0; right: 0; background: var(--input);
    border-top: 1px solid var(--border); font-family: monospace; font-size: 11px; color: var(--text); opacity: 0.8;
    padding: 6px 12px; white-space: pre-wrap; max-height: 80px; overflow-y: auto;
    display: flex; align-items: flex-start; gap: 8px; z-index: 40; }
  #construct-panel code { flex: 1; overflow-x: auto; }
  #construct-panel button { padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer; font-size: 11px; white-space: nowrap; }
  #construct-panel button:hover { background: var(--accent); }
</style>
</head><body>
<div id='toolbar'>
  <strong>Ariadne</strong>
  <select id='graphSelect' onchange='selectGraph()' onfocus='refreshGraphList()' title='Select graph'>
    <option value=''>— select graph —</option>
  </select>
  <input id='search' placeholder='Search nodes...' oninput='searchNodes()'>
  <select id='predicates' multiple title='Filter predicates (ctrl+click)' style='display:none'></select>
  <button onclick='togglePredPanel()'>Predicates ▼</button>
  <button onclick='toggleTypePanel()'>Types ▼</button>
  <button onclick='loadGraph()'>Apply</button>
  <button onclick='resetGraph()'>Reset</button>
  <select id='layout' onchange='changeLayout()'>
    <option value='cose-bilkent'>Force (bilkent)</option>
    <option value='dagre'>Dagre (DAG)</option>
    <option value='cose'>Force (basic)</option>
    <option value='breadthfirst'>Hierarchical</option>
    <option value='circle'>Circular</option>
    <option value='concentric'>Concentric</option>
    <option value='grid'>Grid</option>
  </select>
  <select id='labelMode' onchange='updateLabelMode()'>
    <option value='hover'>Labels: hover</option>
    <option value='all'>Labels: all</option>
    <option value='none'>Labels: none</option>
  </select>
  <label><input type='checkbox' id='edgeLabel' onchange='updateEdgeLabels()'> Edge labels</label>
  <input type='range' id='spacing' min='1' max='10' value='5' title='Node spacing' onchange='changeLayout()'>
  <input type='number' id='nodeLimit' value='200' min='10' max='5000' step='50' title='Max nodes' style='width:60px' onchange='loadGraph()'>
  <button onclick='cy.fit()'>Fit</button>
  <button onclick='selectAll()'>All predicates</button>
  <button onclick='toggleQueryPanel()'>SPARQL</button>
  <span id='stats' onclick='showStats()' style='cursor:pointer' title='Click for details'></span>
  <button onclick='toggleTheme()' title='Toggle theme'>☀</button>
</div>
<div id='cy'></div>
<div id='pred-panel'><div class='panel-btns'><button onclick='panelAll(this.parentNode.parentNode.id);loadGraph()'>All</button><button onclick='panelNone(this.parentNode.parentNode.id);loadGraph()'>None</button></div></div>
<div id='type-panel'><div class='panel-btns'><button onclick='panelAll(this.parentNode.parentNode.id);loadGraph()'>All</button><button onclick='panelNone(this.parentNode.parentNode.id);loadGraph()'>None</button></div></div>
<div id='legend'></div>
<div id='info'></div>
<div id='ctx-menu'>
  <div onclick='ctxExpand()'>Expand</div>
  <div onclick='ctxCollapse()'>Collapse</div>
  <div onclick='ctxHide()'>Hide</div>
  <div onclick='ctxPin()'>Pin/Unpin</div>
</div>
<div id='query-panel'>
  <div id='query-bar'>
    <button onclick='runQuery()'>Run</button>
    <button onclick='filterToResults()'>Filter</button>
    <button onclick='toggleQueryPanel()'>Close</button>
    <span id='query-status'></span>
  </div>
  <textarea id='query-input' placeholder='SELECT ?s ?p ?o WHERE { ?s ?p ?o } LIMIT 10'></textarea>
  <div id='query-results'></div>
</div>
<div id='construct-panel'>
  <code id='construct-query'></code>
  <button onclick='copyConstruct()'>Copy</button>
  <button onclick='runConstruct()'>Run</button>
  <button onclick='exportPNG()'>PNG</button>
  <button onclick='exportSVG()'>SVG</button>
  <button onclick='shareURL()'>Share</button>
</div>
<script>
let cy;
let filtered = false;
let typeColors = {};
// Load predicate list and type colors
Promise.all([
  fetch('/api/predicates').then(r=>r.json()),
  fetch('/api/types').then(r=>r.json())
]).then(([preds, types]) => {
  typeColors = types;
  buildLegend(types);
  // Build type filter panel
  let typePanel = document.getElementById('type-panel');
  // Get counts
  fetch('/api/type-counts').then(r=>r.json()).then(counts=>{
    for(let [typ, color] of Object.entries(types)){
      let label = document.createElement('label');
      let cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = typ;
      cb.checked = true;
      cb.onchange = applyTypeFilter;
      label.appendChild(cb);
      let swatch = document.createElement('span');
      swatch.className = 'legend-swatch';
      swatch.style.background = color;
      label.appendChild(swatch);
      let short = typ.split('#').pop().split('/').pop();
      let count = counts[typ] || 0;
      label.appendChild(document.createTextNode(' ' + short + ' (' + count + ')'));
      typePanel.appendChild(label);
    }
    applyURLTypeParams();
  });
  document.getElementById('cy').addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('click', hideCtxMenu);
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if(e.key === '/' || (e.ctrlKey && e.key === 'f')){
      e.preventDefault(); document.getElementById('search').focus();
    }
    if(e.key === 'f' && !e.ctrlKey) cy.fit();
    if(e.key === 'r') resetGraph();
    if(e.key === '+' || e.key === '=') { e.preventDefault(); radiateDepth(1); }
    if(e.key === '-') { e.preventDefault(); radiateDepth(-1); }
    if(e.key === 'Escape'){
      cy.elements().removeClass('highlighted dimmed');
      document.getElementById('info').style.display='none';
      hideCtxMenu();
      let qp = document.getElementById('query-panel');
      if(qp.classList.contains('open')) toggleQueryPanel();
    }
  });
  let panel = document.getElementById('pred-panel');
  preds.forEach((p,i) => {
    let label = document.createElement('label');
    let cb = document.createElement('input');
    cb.type = 'checkbox'; cb.value = p;
    cb.checked = i < 3;
    cb.onchange = loadGraph;
    label.appendChild(cb);
    label.appendChild(document.createTextNode(p.split('#').pop().split('/').pop()));
    panel.appendChild(label);
  });
  applyURLParams();
  loadGraph();
});
function buildLegend(types){
  let legend = document.getElementById('legend');
  legend.innerHTML = '';
  for(let [typ, color] of Object.entries(types)){
    let item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = '<span class="legend-swatch" style="background:'+color+'"></span>'
      + typ.split('#').pop().split('/').pop();
    legend.appendChild(item);
  }
  if(Object.keys(types).length > 0) legend.style.display = 'block';
}
function getSelectedPredicates(){
  return Array.from(document.querySelectorAll('#pred-panel input:checked')).map(cb => cb.value);
}
function togglePredPanel(){
  let p = document.getElementById('pred-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  document.getElementById('type-panel').style.display = 'none';
}
function toggleTypePanel(){
  let p = document.getElementById('type-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
  document.getElementById('pred-panel').style.display = 'none';
}
function applyTypeFilter(){
  loadGraph();
}
function refreshGraphList(){
  fetch('/api/graphs').then(r=>r.json()).then(names=>{
    let sel = document.getElementById('graphSelect');
    let current = sel.value;
    sel.innerHTML = '<option value="">— select graph —</option>';
    names.forEach(n => {
      let opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      if(n === current) opt.selected = true;
      sel.appendChild(opt);
    });
  });
}
function selectGraph(){
  let name = document.getElementById('graphSelect').value;
  if(!name) return;
  fetch('/api/select-graph?name=' + encodeURIComponent(name)).then(r=>r.json()).then(resp=>{
    if(resp.error){ alert(resp.error); return; }
    filtered = false;
    radiateUri = null;
    radiateLevel = 1;
    refreshPanels();
  });
}
function refreshPanels(){
  Promise.all([
    fetch('/api/predicates').then(r=>r.json()),
    fetch('/api/types').then(r=>r.json())
  ]).then(([preds, types]) => {
    typeColors = types;
    buildLegend(types);
    // Rebuild predicate panel
    let panel = document.getElementById('pred-panel');
    panel.querySelectorAll('label').forEach(l => l.remove());
    preds.forEach((p,i) => {
      let label = document.createElement('label');
      let cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = p;
      cb.checked = true;
      cb.onchange = loadGraph;
      label.appendChild(cb);
      label.appendChild(document.createTextNode(p.split('#').pop().split('/').pop()));
      panel.appendChild(label);
    });
    // Rebuild type panel
    fetch('/api/type-counts').then(r=>r.json()).then(counts=>{
      let typePanel = document.getElementById('type-panel');
      typePanel.querySelectorAll('label').forEach(l => l.remove());
      for(let [typ, color] of Object.entries(types)){
        let label = document.createElement('label');
        let cb = document.createElement('input');
        cb.type = 'checkbox'; cb.value = typ;
        cb.checked = true;
        cb.onchange = applyTypeFilter;
        label.appendChild(cb);
        let swatch = document.createElement('span');
        swatch.className = 'legend-swatch';
        swatch.style.background = color;
        label.appendChild(swatch);
        let short = typ.split('#').pop().split('/').pop();
        let count = counts[typ] || 0;
        label.appendChild(document.createTextNode(' ' + short + ' (' + count + ')'));
        typePanel.appendChild(label);
      }
      loadGraph();
    });
  });
}
refreshGraphList();
function getLabelColor(){
  return document.documentElement.classList.contains('light') ? '#222' : '#eee';
}
function getNodeLimit(){
  return document.getElementById('nodeLimit').value || '200';
}
function appendLimit(url){
  let lim = getNodeLimit();
  return url + (url.includes('?') ? '&' : '?') + 'limit=' + lim;
}
function getHighlightColor(){
  return document.documentElement.classList.contains('light') ? '#e17055' : '#ffd700';
}
function loadGraph(){
  if(filtered && radiateUri) {
    // Re-fetch from server with current filters but same center
    let url = '/api/graph?center=' + encodeURIComponent(radiateUri) + '&depth=' + radiateLevel;
    let selPreds = getSelectedPredicates();
    let totalPreds = document.querySelectorAll('#pred-panel input').length;
    if(selPreds.length < totalPreds)
      url += '&predicates=' + encodeURIComponent(selPreds.join(','));
    let typeChecks = Array.from(document.querySelectorAll('#type-panel input:checked')).map(cb => cb.value);
    let typeTotal = document.querySelectorAll('#type-panel input').length;
    if(typeChecks.length > 0 && typeChecks.length < typeTotal)
      url += '&types=' + encodeURIComponent(typeChecks.join(','));
    document.getElementById('stats').textContent = 'Loading...';
    fetch(appendLimit(url)).then(r=>r.json()).then(resp=>{
      let data = resp.elements || resp;
      cy.elements().remove();
      cy.add(data);
      cy.nodes().forEach(n => {
        let t = n.data('type');
        if(t && typeColors[t]) n.addClass('type-' + t.replace(/[^a-zA-Z0-9]/g, '_'));
      });
      if(document.getElementById('labelMode').value==='all') applyZoomLabels();
      if(document.getElementById('edgeLabel').checked) updateEdgeLabels();
      cy.layout(getLayoutOpts(false)).run();
      let center = cy.nodes().filter(n => n.data('uri') === radiateUri);
      if(center.length > 0) center.addClass('highlighted');
      document.getElementById('stats').textContent =
        cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges (depth ' + radiateLevel + ')';
      updateConstruct();
    });
    return;
  }
  if(filtered) return;
  let selected = getSelectedPredicates();
  let total = document.querySelectorAll('#pred-panel input').length;
  let url = '/api/graph';
  let params = [];
  if(selected.length < total)
    params.push('predicates=' + encodeURIComponent(selected.join(',')));
  let typeChecks = Array.from(document.querySelectorAll('#type-panel input:checked')).map(cb => cb.value);
  let typeTotal = document.querySelectorAll('#type-panel input').length;
  if(typeChecks.length > 0 && typeChecks.length < typeTotal)
    params.push('types=' + encodeURIComponent(typeChecks.join(',')));
  if(params.length > 0) url += '?' + params.join('&');
  fetch(appendLimit(url)).then(r=>r.json()).then(resp=>{
    let data = resp.elements;
    let totalNodes = resp.totalNodes;
    if(cy) cy.destroy();
    let labelMode = document.getElementById('labelMode').value;
    let showEdgeLabels = document.getElementById('edgeLabel').checked;
    cy = cytoscape({
      container: document.getElementById('cy'),
      elements: data,
      style: [
        { selector: 'node', style: {
          'label': labelMode==='all' ? 'data(label)' : '',
          'background-color': '#e94560',
          'color': getLabelColor(), 'font-size': '8px', 'min-zoomed-font-size': 8,
          'text-valign': 'bottom', 'text-margin-y': 4,
          'width': 14, 'height': 14 }},
        { selector: 'edge', style: {
          'curve-style': 'bezier',
          'label': '',
          'font-size': '7px', 'color': '#aaa', 'text-rotation': 'autorotate',
          'text-margin-y': -10, 'text-background-color': '#1a1a2e',
          'text-background-opacity': 0.8, 'text-background-padding': '2px',
          'target-arrow-shape': 'triangle', 'line-color': '#0f3460',
          'target-arrow-color': '#0f3460', 'width': 1.5, 'opacity': 0.6 }},
        { selector: 'node:selected', style: { 'background-color': getHighlightColor(), 'border-width': 3, 'border-color': getHighlightColor() }},
        { selector: 'edge:selected', style: { 'line-color': getHighlightColor(), 'target-arrow-color': getHighlightColor() }},
        { selector: 'node.highlighted', style: {
          'background-color': getHighlightColor(), 'label': 'data(label)', 'border-width': 3, 'border-color': '#fff',
          'color': getLabelColor(), 'font-size': '11px', 'text-valign': 'bottom', 'text-margin-y': 4 }},
        { selector: 'edge.highlighted', style: {
          'line-color': getHighlightColor(), 'target-arrow-color': getHighlightColor(), 'opacity': 1 }},
        { selector: '.dimmed', style: { opacity: 0.08 }}
      ],
      layout: getLayoutOpts(false),
      wheelSensitivity: 0.15,
      minZoom: 0.1,
      maxZoom: 10
    });
    // Apply type colors via classes
    cy.nodes().forEach(n => {
      let t = n.data('type');
      if(t && typeColors[t]) n.addClass('type-' + t.replace(/[^a-zA-Z0-9]/g, '_'));
    });
    // Add type color styles
    let typeStyles = [];
    for(let [typ, color] of Object.entries(typeColors)){
      let cls = 'type-' + typ.replace(/[^a-zA-Z0-9]/g, '_');
      typeStyles.push({selector: 'node.' + cls, style: {'background-color': color}});
    }
    if(typeStyles.length > 0) cy.style().append(typeStyles).update();
    if(showEdgeLabels) updateEdgeLabels();
    document.getElementById('stats').textContent =
      cy.nodes().length + (totalNodes > cy.nodes().length ? ' of ' + totalNodes : '') +
      ' nodes, ' + cy.edges().length + ' edges';
    updateConstruct();
    cy.on('mouseover', 'node', function(e){
      if(document.getElementById('labelMode').value === 'hover'){
        e.target.style('label', e.target.data('label'));
      }
    });
    cy.on('mouseout', 'node', function(e){
      if(document.getElementById('labelMode').value === 'hover' && !e.target.hasClass('highlighted'))
        e.target.style('label', '');
    });
    cy.on('tap', 'node', function(e){
      let n = e.target;
      cy.elements().removeClass('highlighted dimmed');
      let hood = n.neighborhood().add(n);
      hood.addClass('highlighted');
      cy.elements().not(hood).addClass('dimmed');
      // Fetch full node details
      fetch('/api/node?id=' + encodeURIComponent(n.data('uri'))).then(r=>r.json()).then(details=>{
        let info = '<b>' + details.label + '</b><br>';
        if(details.outgoing && details.outgoing.length > 0){
          info += '<br><u>Properties</u><br>';
          details.outgoing.forEach(t => {
            let pred = t.predicate.split('#').pop().split('/').pop();
            let obj = t.object.split('#').pop().split('/').pop();
            info += '<i>' + pred + '</i>: ' + obj + '<br>';
          });
        }
        if(details.incoming && details.incoming.length > 0){
          info += '<br><u>Referenced by</u><br>';
          details.incoming.forEach(t => {
            let pred = t.predicate.split('#').pop().split('/').pop();
            let subj = t.subject.split('#').pop().split('/').pop();
            info += subj + ' <i>' + pred + '</i><br>';
          });
        }
        let el = document.getElementById('info');
        el.innerHTML = info; el.style.display = 'block';
      });
    });
    cy.on('tap', function(e){ if(e.target===cy){
      cy.elements().removeClass('highlighted dimmed');
      document.getElementById('info').style.display='none';
      hideCtxMenu();
    }});
    cy.on('zoom', function(){
      if(document.getElementById('labelMode').value === 'all') applyZoomLabels();
    });
    cy.on('cxttap', 'node', function(e){
      e.originalEvent.preventDefault();
      showCtxMenu(e.originalEvent.clientX, e.originalEvent.clientY, e.target);
    });
    cy.on('dblclick', 'node', function(e){
      let id = e.target.data('uri');
      radiateUri = id;
      radiateLevel = 2;
      let selected = getSelectedPredicates();
      let total = document.querySelectorAll('#pred-panel input').length;
      let url = '/api/graph?center=' + encodeURIComponent(id) + '&depth=2';
      if(selected.length > 0 && selected.length < total)
        url += '&predicates=' + encodeURIComponent(selected.join(','));
      fetch(appendLimit(url)).then(r=>r.json()).then(resp=>{
        let data = resp.elements || resp;
        cy.elements().remove();
        cy.add(data);
        cy.nodes().forEach(n => {
          let t = n.data('type');
          if(t && typeColors[t]) n.style('background-color', typeColors[t]);
        });
        let mode = document.getElementById('labelMode').value;
        if(mode==='all') cy.nodes().forEach(n => n.style('label', n.data('label')));
        if(document.getElementById('edgeLabel').checked) updateEdgeLabels();
        cy.layout(getLayoutOpts(true)).run();
        document.getElementById('stats').textContent =
          cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
        // Highlight the centered node
        let center = cy.nodes().filter(n => n.data('uri') === id);
        if(center.length > 0) center.addClass('highlighted');
        filtered = true;
      });
    });
  });
}
function searchNodes(){
  let q = document.getElementById('search').value.toLowerCase();
  cy.elements().removeClass('highlighted dimmed');
  if(!q) return;
  let matches = cy.nodes().filter(n => n.data('label').toLowerCase().includes(q));
  if(matches.length > 0){
    matches.addClass('highlighted');
    cy.elements().not(matches).addClass('dimmed');
    cy.fit(matches, 50);
  }
}
function getLayoutOpts(animate){
  let name = document.getElementById('layout').value;
  let s = parseInt(document.getElementById('spacing').value);
  let opts = { name: name, animate: animate };
  if(name === 'cose-bilkent') { opts.nodeRepulsion = s * 4000; opts.idealEdgeLength = s * 24; opts.animate = animate ? 'end' : false; opts.gravityRange = 1.5; }
  if(name === 'cose') { opts.nodeRepulsion = function(){ return s * 8000; }; opts.idealEdgeLength = function(){ return s * 20; }; }
  if(name === 'dagre') { opts.rankDir = 'TB'; opts.nodeSep = s * 12; opts.rankSep = s * 20; }
  if(name === 'breadthfirst') { opts.spacingFactor = s * 0.3; }
  return opts;
}
function changeLayout(){
  cy.layout(getLayoutOpts(true)).run();
}
function selectAll(){
  document.querySelectorAll('#pred-panel input').forEach(cb => cb.checked = true);
  loadGraph();
}
function panelAll(id){
  document.querySelectorAll('#'+id+' input[type=checkbox]').forEach(cb => cb.checked = true);
}
function panelNone(id){
  document.querySelectorAll('#'+id+' input[type=checkbox]').forEach(cb => cb.checked = false);
}
function resetGraph(){
  filtered = false;
  radiateUri = null;
  radiateLevel = 1;
  document.querySelectorAll('#pred-panel input').forEach(cb => cb.checked = true);
  document.querySelectorAll('#type-panel input').forEach(cb => cb.checked = true);
  loadGraph();
}
function showStats(){
  fetch('/api/info').then(r=>r.json()).then(info=>{
    let html = '<b>Graph: ' + info.name + '</b><br><br>';
    html += 'Total triples: ' + info.triples + '<br>';
    html += 'Total subjects: ' + info.subjects + '<br>';

    html += '<u>Visible</u><br>';
    html += 'Nodes: ' + cy.nodes().length + '<br>';
    html += 'Edges: ' + cy.edges().length + '<br><br>';
    html += '<u>Shortcuts</u><br>';
    html += '<i>/</i> Search &nbsp; <i>f</i> Fit &nbsp; <i>r</i> Reset<br>';
    html += '<i>Esc</i> Clear selection';
    let el = document.getElementById('info');
    el.innerHTML = html; el.style.display = 'block';
  });
}
let ctxNode = null;
function showCtxMenu(x, y, node){
  ctxNode = node;
  let menu = document.getElementById('ctx-menu');
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  menu.style.display = 'block';
}
function hideCtxMenu(){ document.getElementById('ctx-menu').style.display = 'none'; }
function ctxExpand(){
  hideCtxMenu();
  if(!ctxNode) return;
  let id = ctxNode.data('uri');
  let cyId = ctxNode.id();
  fetch('/api/node?id=' + encodeURIComponent(id)).then(r=>r.json()).then(details=>{
    let existingUris = new Set(cy.nodes().map(n => n.data('uri')));
    let toAdd = [];
    let counter = cy.nodes().length;
    details.outgoing.forEach(t => {
      let tgtId;
      let existing = cy.nodes().filter(n => n.data('uri') === t.object);
      if(existing.length > 0){ tgtId = existing[0].id(); }
      else { tgtId = 'n' + (++counter); toAdd.push({group:'nodes', data:{id:tgtId, uri:t.object, label:t.object.split('#').pop().split('/').pop()}}); }
      toAdd.push({group:'edges', data:{id:'e'+Math.random(), source:cyId, target:tgtId, label:t.predicate}});
    });
    details.incoming.forEach(t => {
      let srcId;
      let existing = cy.nodes().filter(n => n.data('uri') === t.subject);
      if(existing.length > 0){ srcId = existing[0].id(); }
      else { srcId = 'n' + (++counter); toAdd.push({group:'nodes', data:{id:srcId, uri:t.subject, label:t.subject.split('#').pop().split('/').pop()}}); }
      toAdd.push({group:'edges', data:{id:'e'+Math.random(), source:srcId, target:cyId, label:t.predicate}});
    });
    cy.add(toAdd);
    // Apply colors to new nodes
    cy.nodes().forEach(n => {
      let t = n.data('type');
      if(t && typeColors[t]) n.addClass('type-' + t.replace(/[^a-zA-Z0-9]/g, '_'));
    });
    if(document.getElementById('labelMode').value==='all') applyZoomLabels();
    if(document.getElementById('edgeLabel').checked) updateEdgeLabels();
    cy.layout(getLayoutOpts(true)).run();
    document.getElementById('stats').textContent =
      cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
  });
}
function ctxCollapse(){
  hideCtxMenu();
  let targets = cy.nodes(':selected');
  if(targets.length === 0 && ctxNode) targets = ctxNode.collection();
  targets.forEach(n => {
    let hood = n.neighborhood().nodes().filter(nn => nn.degree() <= 1 && !nn.selected());
    hood.connectedEdges().remove();
    hood.remove();
  });
  document.getElementById('stats').textContent =
    cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
}
function ctxHide(){
  hideCtxMenu();
  let targets = cy.nodes(':selected');
  if(targets.length === 0 && ctxNode) targets = ctxNode.collection();
  targets.connectedEdges().remove();
  targets.remove();
  document.getElementById('stats').textContent =
    cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
}
function ctxPin(){
  hideCtxMenu();
  let targets = cy.nodes(':selected');
  if(targets.length === 0 && ctxNode) targets = ctxNode.collection();
  targets.forEach(n => { if(n.locked()) n.unlock(); else n.lock(); });
}
function updateLabelMode(){
  let mode = document.getElementById('labelMode').value;
  if(mode==='all') applyZoomLabels();
  else cy.nodes().style('label', '');
}
function applyZoomLabels(){
  let zoom = cy.zoom();
  if(zoom > 0.8) cy.nodes().forEach(n => n.style('label', n.data('label')));
  else if(zoom > 0.4) {
    // Only show labels for nodes with few connections or highlighted
    cy.nodes().forEach(n => {
      if(n.degree() <= 3 || n.hasClass('highlighted')) n.style('label', n.data('label'));
      else n.style('label', '');
    });
  }
  else cy.nodes().style('label', '');
}
function updateEdgeLabels(){
  let show = document.getElementById('edgeLabel').checked;
  if(show) cy.edges().forEach(e => {
    let lbl = e.data('label');
    e.style('label', lbl.split('#').pop().split('/').pop());
  });
  else cy.edges().style('label', '');
}
function toggleQueryPanel(){
  let p = document.getElementById('query-panel');
  p.classList.toggle('open');
  if(p.classList.contains('open')){
    document.getElementById('cy').style.height = 'calc(100vh - 50px - 36px - 40vh)';
    document.getElementById('query-input').focus();
  } else {
    document.getElementById('cy').style.height = 'calc(100vh - 50px - 36px)';
  }
  if(cy) cy.resize();
}
function runQuery(){
  let q = document.getElementById('query-input').value.trim();
  if(!q) return;
  document.getElementById('query-status').textContent = 'Running...';
  fetch('/sparql?query=' + encodeURIComponent(q)).then(r=>r.json()).then(data=>{
    if(data.error){
      document.getElementById('query-status').textContent = 'Error: ' + data.error;
      document.getElementById('query-results').innerHTML = '';
      return;
    }
    if(data.boolean !== undefined){
      document.getElementById('query-status').textContent = 'Result: ' + data.boolean;
      document.getElementById('query-results').innerHTML = '';
      return;
    }
    let results = data.results || [];
    document.getElementById('query-status').textContent = results.length + ' results';
    if(results.length === 0){ document.getElementById('query-results').innerHTML = ''; return; }
    let cols = results[0].length;
    let html = '<table><tr>';
    for(let i=0; i<cols; i++) html += '<th>?' + (i+1) + '</th>';
    html += '</tr>';
    results.forEach(row => {
      html += '<tr>';
      row.forEach(cell => {
        let short = String(cell).split('#').pop().split('/').pop();
        let safe = String(cell).replace(/&/g,'&amp;').replace(/</g,'&lt;');
        html += '<td data-uri="' + safe + '" onclick="highlightInGraph(this.dataset.uri)">' + short + '</td>';
      });
      html += '</tr>';
    });
    html += '</table>';
    document.getElementById('query-results').innerHTML = html;
    // Highlight matching nodes
    highlightQueryResults(results);
  }).catch(e => {
    document.getElementById('query-status').textContent = 'Error: ' + e.message;
  });
}
let radiateLevel = 1;
let radiateUri = null;
function radiateDepth(delta){
  let selected = cy.nodes('.highlighted');
  if(selected.length === 0) selected = cy.nodes(':selected');
  if(selected.length === 0 && !radiateUri) return;
  if(selected.length > 0) radiateUri = selected[0].data('uri');
  if(!radiateUri) return;
  radiateLevel = Math.max(0, radiateLevel + delta);
  let uri = radiateUri;
  // Depth 0: reload full graph with node highlighted
  if(radiateLevel === 0){
    filtered = false;
    loadGraph();
    // After load, highlight the node (need slight delay for async)
    setTimeout(function(){
      let m = cy.nodes().filter(n => n.data('uri') === uri);
      if(m.length > 0) m.addClass('highlighted');
      document.getElementById('stats').textContent =
        cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges (depth 0)';
    }, 500);
    return;
  }
  // Generate UNION of forward and reverse patterns for each depth
  let patterns = [];
  for(let d = 1; d <= radiateLevel; d++){
    let fwdParts = [];
    let revParts = [];
    for(let i = 0; i < d; i++){
      let s = i === 0 ? '<' + uri + '>' : '?f' + (i-1);
      fwdParts.push(s + ' ?fp' + i + ' ?f' + i);
      let rs = i === 0 ? '<' + uri + '>' : '?r' + (i-1);
      revParts.push('?r' + i + ' ?rp' + i + ' ' + rs);
    }
    patterns.push('{ ' + fwdParts.join(' . ') + ' . BIND(?f' + (d-1) + ' AS ?n) }');
    patterns.push('{ ' + revParts.join(' . ') + ' . BIND(?r' + (d-1) + ' AS ?n) }');
  }
  let q = 'SELECT DISTINCT ?n WHERE { ' + patterns.join(' UNION ') + ' }';
  document.getElementById('stats').textContent = 'Loading depth ' + radiateLevel + '...';
  // Build URL with current filters
  let url = '/api/graph?center=' + encodeURIComponent(uri) + '&depth=' + radiateLevel;
  let selPreds = getSelectedPredicates();
  let totalPreds = document.querySelectorAll('#pred-panel input').length;
  if(selPreds.length < totalPreds)
    url += '&predicates=' + encodeURIComponent(selPreds.join(','));
  let typeChecks = Array.from(document.querySelectorAll('#type-panel input:checked')).map(cb => cb.value);
  let typeTotal = document.querySelectorAll('#type-panel input').length;
  if(typeChecks.length > 0 && typeChecks.length < typeTotal)
    url += '&types=' + encodeURIComponent(typeChecks.join(','));
  fetch(url)
    .then(r=>r.json()).then(resp=>{
      let data = resp.elements || resp;
      cy.elements().remove();
      cy.add(data);
      cy.nodes().forEach(n => {
        let t = n.data('type');
        if(t && typeColors[t]) n.addClass('type-' + t.replace(/[^a-zA-Z0-9]/g, '_'));
      });
      if(document.getElementById('labelMode').value==='all') applyZoomLabels();
      if(document.getElementById('edgeLabel').checked) updateEdgeLabels();
      cy.layout(getLayoutOpts(false)).run();
      let center = cy.nodes().filter(n => n.data('uri') === uri);
      if(center.length > 0) center.addClass('highlighted');
      filtered = true;
      document.getElementById('stats').textContent =
        cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges (depth ' + radiateLevel + ')';
    });
}
function filterToResults(){
  let highlighted = cy.nodes('.highlighted');
  if(highlighted.length === 0) return;
  cy.nodes().not(highlighted).connectedEdges().remove();
  cy.nodes().not(highlighted).remove();
  cy.elements().removeClass('highlighted dimmed');
  cy.layout(getLayoutOpts(true)).run();
  document.getElementById('stats').textContent =
    cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
  filtered = true;
}
function highlightQueryResults(results){
  cy.elements().removeClass('highlighted dimmed');
  let uris = new Set();
  results.forEach(row => row.forEach(cell => uris.add(String(cell))));
  let matches = cy.nodes().filter(n => uris.has(n.data('uri')));
  if(matches.length > 0){
    matches.addClass('highlighted');
    cy.elements().not(matches).not(matches.connectedEdges()).addClass('dimmed');
  }
}
function highlightInGraph(uri){
  cy.elements().removeClass('highlighted dimmed');
  let matches = cy.nodes().filter(n => n.data('uri') === uri);
  if(matches.length === 0){
    // Node not in view — load it with its neighborhood
    let url = '/api/graph?center=' + encodeURIComponent(uri) + '&depth=1';
    fetch(appendLimit(url)).then(r=>r.json()).then(resp=>{
      let data = resp.elements || resp;
      cy.elements().remove();
      cy.add(data);
      cy.nodes().forEach(n => {
        let t = n.data('type');
        if(t && typeColors[t]) n.addClass('type-' + t.replace(/[^a-zA-Z0-9]/g, '_'));
      });
      if(document.getElementById('labelMode').value==='all') applyZoomLabels();
      if(document.getElementById('edgeLabel').checked) updateEdgeLabels();
      cy.layout(getLayoutOpts(false)).run();
      let m = cy.nodes().filter(n => n.data('uri') === uri);
      if(m.length > 0){
        m.addClass('highlighted');
        cy.elements().not(m).not(m.connectedEdges()).addClass('dimmed');
        cy.fit(m, 50);
      }
      document.getElementById('stats').textContent =
        cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
      showNodeDetails(uri);
    });
    return;
  }
  matches.addClass('highlighted');
  cy.elements().not(matches).not(matches.connectedEdges()).addClass('dimmed');
  cy.fit(matches, 50);
  showNodeDetails(uri);
}
function showNodeDetails(uri){
  fetch('/api/node?id=' + encodeURIComponent(uri)).then(r=>r.json()).then(details=>{
    let info = '<b>' + details.label + '</b><br>';
    if(details.outgoing && details.outgoing.length > 0){
      info += '<br><u>Properties</u><br>';
      details.outgoing.forEach(t => {
        let pred = t.predicate.split('#').pop().split('/').pop();
        let obj = t.object.split('#').pop().split('/').pop();
        info += '<i>' + pred + '</i>: ' + obj + '<br>';
      });
    }
    if(details.incoming && details.incoming.length > 0){
      info += '<br><u>Referenced by</u><br>';
      details.incoming.forEach(t => {
        let pred = t.predicate.split('#').pop().split('/').pop();
        let subj = t.subject.split('#').pop().split('/').pop();
        info += subj + ' <i>' + pred + '</i><br>';
      });
    }
    let el = document.getElementById('info');
    el.innerHTML = info; el.style.display = 'block';
  });
}
function updateConstruct(){
  let preds = getSelectedPredicates();
  let total = document.querySelectorAll('#pred-panel input').length;
  let where = '';
  if(preds.length > 0 && preds.length < total){
    let alts = preds.map(p => '<' + p + '>').join('|');
    where = '?s ?p ?o . FILTER(?p IN(' + preds.map(p => '<' + p + '>').join(', ') + '))';
  } else {
    where = '?s ?p ?o';
  }
  let q = 'CONSTRUCT { ?s ?p ?o } WHERE { ' + where + ' }';
  document.getElementById('construct-query').textContent = q;
}
function shareURL(){
  let params = new URLSearchParams();
  let preds = getSelectedPredicates();
  let totalPreds = document.querySelectorAll('#pred-panel input').length;
  if(preds.length > 0 && preds.length < totalPreds)
    params.set('predicates', preds.join(','));
  let types = Array.from(document.querySelectorAll('#type-panel input:checked')).map(cb => cb.value);
  let totalTypes = document.querySelectorAll('#type-panel input').length;
  if(types.length > 0 && types.length < totalTypes)
    params.set('types', types.join(','));
  params.set('layout', document.getElementById('layout').value);
  params.set('spacing', document.getElementById('spacing').value);
  params.set('labels', document.getElementById('labelMode').value);
  if(document.getElementById('edgeLabel').checked) params.set('edgeLabels', '1');
  let url = window.location.origin + window.location.pathname + '?' + params.toString();
  navigator.clipboard.writeText(url);
  document.getElementById('stats').textContent = 'URL copied!';
  setTimeout(function(){ loadGraph(); }, 1500);
}
function applyURLParams(){
  let params = new URLSearchParams(window.location.search);
  if(params.has('layout')) document.getElementById('layout').value = params.get('layout');
  if(params.has('spacing')) document.getElementById('spacing').value = params.get('spacing');
  if(params.has('labels')) document.getElementById('labelMode').value = params.get('labels');
  if(params.has('edgeLabels')) document.getElementById('edgeLabel').checked = true;
  if(params.has('limit')) document.getElementById('nodeLimit').value = params.get('limit');
  if(params.has('predicates')){
    let wanted = params.get('predicates').split(',');
    document.querySelectorAll('#pred-panel input').forEach(cb => {
      cb.checked = wanted.includes(cb.value);
    });
  }
}
function applyURLTypeParams(){
  let params = new URLSearchParams(window.location.search);
  if(params.has('types')){
    let wanted = params.get('types').split(',');
    document.querySelectorAll('#type-panel input').forEach(cb => {
      cb.checked = wanted.includes(cb.value);
    });
    loadGraph();
  }
}

  navigator.clipboard.writeText(q);
}
function runConstruct(){

// Poll for pushed queries from CL side
setInterval(function(){
  fetch('/api/pushed').then(r=>r.json()).then(data=>{
    if(!data) return;
    // Handle focus command — recenter graph on a node
    if(data.focus){
      let url = '/api/graph?center=' + encodeURIComponent(data.focus) + '&depth=' + (data.depth || 2);
      let selPreds = getSelectedPredicates();
      let totalPreds = document.querySelectorAll('#pred-panel input').length;
      if(selPreds.length > 0 && selPreds.length < totalPreds)
        url += '&predicates=' + encodeURIComponent(selPreds.join(','));
      radiateUri = data.focus;
      radiateLevel = data.depth || 2;
      fetch(appendLimit(url)).then(r=>r.json()).then(resp=>{
        let elems = resp.elements || resp;
        cy.elements().remove();
        cy.add(elems);
        cy.nodes().forEach(n => {
          let t = n.data('type');
          if(t && typeColors[t]) n.addClass('type-' + t.replace(/[^a-zA-Z0-9]/g, '_'));
        });
        if(document.getElementById('labelMode').value==='all') applyZoomLabels();
        if(document.getElementById('edgeLabel').checked) updateEdgeLabels();
        cy.layout(getLayoutOpts(false)).run();
        let center = cy.nodes().filter(n => n.data('uri') === data.focus);
        if(center.length > 0) center.addClass('highlighted');
        document.getElementById('stats').textContent =
          cy.nodes().length + ' nodes, ' + cy.edges().length + ' edges';
        filtered = true;
      });
      return;
    }
    // Open SPARQL panel and show results
    let p = document.getElementById('query-panel');
    if(!p.classList.contains('open')) toggleQueryPanel();
    document.getElementById('query-input').value = data.query || '';
    if(data.results === 'true' || data.results === 'false'){
      document.getElementById('query-status').textContent = 'Result: ' + data.results;
      document.getElementById('query-results').innerHTML = '';
      return;
    }
    let results = data.results || [];
    document.getElementById('query-status').textContent = results.length + ' results (pushed)';
    if(results.length === 0){ document.getElementById('query-results').innerHTML = ''; return; }
    let cols = results[0].length;
    let html = '<table><tr>';
    for(let i=0; i<cols; i++) html += '<th>?' + (i+1) + '</th>';
    html += '</tr>';
    results.forEach(row => {
      html += '<tr>';
      row.forEach(cell => {
        let short = String(cell).split('#').pop().split('/').pop();
        let safe = String(cell).replace(/&/g,'&amp;').replace(/</g,'&lt;');
        html += '<td data-uri="' + safe + '" onclick="highlightInGraph(this.dataset.uri)">' + short + '</td>';
      });
      html += '</tr>';
    });
    html += '</table>';
    document.getElementById('query-results').innerHTML = html;
    highlightQueryResults(results);
  }).catch(function(){});
}, 2000);
